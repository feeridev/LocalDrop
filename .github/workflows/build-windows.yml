name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --version

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm LocalDrop.spec

      - name: Inspect build output
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "DIST DIRECTORY"
          Write-Host "========================================"

          if (-not (Test-Path "dist")) {
            Write-Error "dist directory does not exist."
            exit 1
          }

          Get-ChildItem -Path "dist" -Recurse |
            Select-Object FullName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "LOCALDROP DIRECTORY"
          Write-Host "========================================"

          if (Test-Path "dist\LocalDrop") {
            Get-ChildItem -Path "dist\LocalDrop" -Recurse |
              Select-Object FullName
          } else {
            Write-Error "dist\LocalDrop does not exist."
            exit 1
          }

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\LocalDrop\LocalDrop.exe")) {
            Write-Error "LocalDrop.exe was not created."
            exit 1
          }

          Write-Host "LocalDrop.exe found."

      - name: Verify application resources
        shell: pwsh
        run: |
          $staticPath = "dist\LocalDrop\app\static"
          $templatesPath = "dist\LocalDrop\app\templates"

          if (-not (Test-Path $staticPath)) {
            Write-Error "Static directory was not included: $staticPath"
            exit 1
          }

          if (-not (Test-Path $templatesPath)) {
            Write-Error "Templates directory was not included: $templatesPath"
            exit 1
          }

          Write-Host "Static directory found."
          Write-Host "Templates directory found."

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found: $iscc"
            exit 1
          }

          & $iscc "installer\LocalDrop.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "installer-output\LocalDrop-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Installer was not created: $installer"
            exit 1
          }

          $size = (Get-Item $installer).Length

          Write-Host "Installer created successfully."
          Write-Host "Path: $installer"
          Write-Host "Size: $size bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-Windows-Installer
          path: installer-output/LocalDrop-Setup.exe
