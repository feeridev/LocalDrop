name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --clean LocalDrop.spec

      - name: Check build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\LocalDrop\LocalDrop.exe")) {
            Write-Error "LocalDrop.exe was not created."
          }

          if (-not (Test-Path "dist\LocalDrop\app\static")) {
            Write-Error "Static directory was not included."
          }

          if (-not (Test-Path "dist\LocalDrop\app\templates")) {
            Write-Error "Templates directory was not included."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\LocalDrop.iss"

      - name: Check installer
        shell: pwsh
        run: |
          if (-not (Test-Path "installer-output\LocalDrop-Setup.exe")) {
            Write-Error "Installer was not created."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-Windows-Installer
          path: installer-output/LocalDrop-Setup.exe
