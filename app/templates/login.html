<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LocalDrop - Login</title>

<style>

    * {
        box-sizing: border-box;
    }

    :root {
        --background: #f6f7fb;
        --surface: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        background: var(--background);
        color: var(--text);
    }

    .login-wrapper {
        width: 100%;
        max-width: 420px;
    }

    .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 40px;

        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.08);
    }

    /* ----------------------------------------
       Brand
    ---------------------------------------- */

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
    }

    .brand-icon {
        width: 44px;
        height: 44px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;
        background: var(--primary);
        color: white;

        font-size: 20px;
        font-weight: 700;
    }

    .brand-name {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
    }

    .brand-description {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
    }

    /* ----------------------------------------
       Header
    ---------------------------------------- */

    .login-header {
        margin-bottom: 28px;
    }

    .login-header h1 {
        margin: 0 0 8px;
        font-size: 26px;
        line-height: 1.2;
    }

    .login-header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
    }

    /* ----------------------------------------
       Form
    ---------------------------------------- */

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;

        font-size: 14px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        height: 46px;

        padding: 0 14px;

        border: 1px solid var(--border);
        border-radius: 9px;

        outline: none;

        background: white;
        color: var(--text);

        font-size: 14px;

        transition:
            border-color 0.15s ease,
            box-shadow 0.15s ease;
    }

    .form-group input::placeholder {
        color: #9ca3af;
    }

    .form-group input:focus {
        border-color: var(--primary);

        box-shadow:
            0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* ----------------------------------------
       Button
    ---------------------------------------- */

    .login-button {
        width: 100%;
        height: 46px;

        border: 0;
        border-radius: 9px;

        background: var(--primary);
        color: white;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background 0.15s ease,
            transform 0.1s ease,
            opacity 0.15s ease;
    }

    .login-button:hover {
        background: var(--primary-hover);
    }

    .login-button:active {
        transform: translateY(1px);
    }

    .login-button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    /* ----------------------------------------
       Message
    ---------------------------------------- */

    #message {
        margin-top: 16px;

        padding: 10px 12px;

        border-radius: 8px;

        background: #fef2f2;
        border: 1px solid #fecaca;

        color: var(--danger);

        font-size: 13px;
        text-align: left;
    }

    #message:empty {
        display: none;
    }

    /* ----------------------------------------
       Register
    ---------------------------------------- */

    .register-link {
        display: flex;
        justify-content: center;
        gap: 5px;

        margin-top: 24px;

        color: var(--muted);
        font-size: 13px;
    }

    .register-link a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    /* ----------------------------------------
       Footer
    ---------------------------------------- */

    .footer {
        margin-top: 18px;

        text-align: center;

        color: #9ca3af;
        font-size: 12px;
    }

    /* ----------------------------------------
       Mobile
    ---------------------------------------- */

    @media (max-width: 480px) {

        body {
            padding: 16px;
        }

        .login-card {
            padding: 28px 22px;
        }

        .login-header h1 {
            font-size: 23px;
        }

    }

</style>


</head>

<body>


<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">

            <div class="brand-icon">
                L
            </div>

            <div>

                <h2 class="brand-name">
                    LocalDrop
                </h2>

                <p class="brand-description">
                    Private LAN file sharing
                </p>

            </div>

        </div>


        <div class="login-header">

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to access your files.
            </p>

        </div>


        <form id="login-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                id="login-button"
                class="login-button"
                type="submit"
            >
                Sign in
            </button>

        </form>


        <div id="message"></div>


        <div class="register-link">

            <span>
                Don't have an account?
            </span>

            <a href="/register">
                Create account
            </a>

        </div>

    </div>


    <div class="footer">
        LocalDrop · Your files. Your network.
    </div>

</div>


<script>

    const form =
        document.getElementById("login-form");

    const message =
        document.getElementById("message");

    const loginButton =
        document.getElementById("login-button");


    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        message.textContent = "";

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document.getElementById("password").value;


        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";


        try {

            const response =
                await fetch("/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username,
                        password
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.detail || "Login failed";

                return;
            }


            window.location.href =
                "/dashboard";


        } catch (error) {

            message.textContent =
                "Unable to connect to LocalDrop";

        } finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Sign in";

        }

    });

</script>


</body>

</html>
